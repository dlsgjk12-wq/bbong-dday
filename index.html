        body {

    </header>

        <!-- Search & Filter Controls -->
        <div class="space-y-3 mb-4">

                <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-sky-400 text-sm"></i>
                <input type="text" id="searchInput" oninput="renderSchedules()" placeholder="이벤트, 스카우트, 캐릭터 검색..."

            </div>

            <!-- Tab Filters -->
            <div class="flex items-center justify-between gap-1.5 text-xs font-semibold">
                <button onclick="setFilter('all')" id="filter-all" class="filter-btn flex-1 py-2 rounded-xl border border-sky-200 bg-sky-600 text-white shadow-2xs transition">
                    전체 일정
                </button>
                <button onclick="setFilter('fav')" id="filter-fav" class="filter-btn flex-1 py-2 rounded-xl border border-sky-200 bg-white text-sky-800 transition flex items-center justify-center space-x-1">
                    <i class="fa-solid fa-heart text-sky-500 text-[10px]"></i>
                    <span>내 일정</span>
                </button>
                <button onclick="setFilter('event')" id="filter-event" class="filter-btn py-2 px-3 rounded-xl border border-sky-200 bg-white text-sky-800 transition">
                    이벤트
                </button>
                <button onclick="setFilter('scout')" id="filter-scout" class="filter-btn py-2 px-3 rounded-xl border border-sky-200 bg-white text-sky-800 transition">
                    스카우트
                </button>
            </div>
        </div>

        <!-- Schedule Card List Container -->
        <div id="scheduleList" class="space-y-3">
            <!-- Rendered via JavaScript -->
        </div>

    </main>

    <!-- Banner & Detail View Modal -->
    <div id="detailModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-50 hidden flex items-center justify-center p-4" onclick="closeModalOnBg(event, 'detailModal')">
        <div class="bg-white rounded-2xl w-full max-w-sm overflow-hidden shadow-2xl transition-all border border-sky-100 animate-in fade-in zoom-in duration-200">
            <!-- Banner Image Section -->
            <div class="relative bg-slate-100 h-40 overflow-hidden" id="detailBannerContainer">
                <img id="detailBannerImg" src="" alt="일정 배너" class="w-full h-full object-cover">
                <div class="absolute inset-0 bg-gradient-to-t from-slate-900/70 via-transparent to-transparent"></div>
                <button onclick="closeModal('detailModal')" class="absolute top-2.5 right-2.5 w-7 h-7 bg-slate-900/40 hover:bg-slate-900/70 text-white rounded-full flex items-center justify-center transition">
                    <i class="fa-solid fa-xmark text-xs"></i>
                </button>
                <span id="detailBadge" class="absolute bottom-2.5 left-2.5 text-[11px] font-bold px-2.5 py-0.5 rounded-full shadow-md"></span>
            </div>

            <!-- Detail Information Body -->
            <div class="p-4 space-y-3">
                <div>
                    <h3 id="detailTitle" class="text-base font-extrabold text-slate-800 mt-0.5 leading-snug"></h3>
                </div>

                <div class="space-y-2 border-t border-sky-100 pt-2.5">
                    <!-- 5 Star Main Character -->
                    <div class="bg-amber-50/80 border border-amber-100 rounded-lg p-2.5">
                        <div class="flex items-center space-x-1 mb-1">
                            <span class="bg-amber-500 text-white text-[9px] font-black px-1.5 py-0.2 rounded">5★</span>
                            <span class="text-[11px] font-bold text-amber-900">5성 메인 캐릭터</span>
                        </div>
                        <p id="detailMainChar" class="text-xs font-bold text-amber-950 pl-0.5"></p>
                    </div>

                    <!-- All Characters -->
                    <div class="bg-sky-50/70 border border-sky-100 rounded-lg p-2.5">
                        <div class="flex items-center space-x-1 mb-1">
                            <i class="fa-solid fa-users text-sky-600 text-[10px]"></i>
                            <span class="text-[11px] font-bold text-sky-900">전체 등장 캐릭터 (4★ / 3★ 포함)</span>
                        </div>
                        <p id="detailAllChar" class="text-xs font-medium text-slate-700 leading-relaxed pl-0.5"></p>
                    </div>

                    <!-- Schedule Dates -->
                    <div class="text-xs pt-1">
                        <div class="bg-slate-50 p-2.5 rounded-lg border border-slate-100 flex items-center justify-between">
                            <span class="text-xs text-slate-500 font-medium">한섭 예상 기간</span>
                            <strong id="detailKrDate" class="text-sky-900 font-bold text-xs"></strong>
                        </div>
                    </div>
                </div>

                        닫기
                    </button>
                </div>
            </div>
        </div>
    </div>

        var schedules = [];
        var activeFilter = 'all';

        window.addEventListener('DOMContentLoaded', function() {
            loadLocalStorageData();
            renderSchedules();
        });

        function loadLocalStorageData() {
            var savedSchedules = localStorage.getItem('enstar_simple_dday_v6');
            if (savedSchedules) {
                try {
                    schedules = JSON.parse(savedSchedules);
                } catch(e) {
                    schedules = DEFAULT_PRESETS;
                }
            } else {
                schedules = DEFAULT_PRESETS;
            }
        }

        function saveLocalStorageData() {
            localStorage.setItem('enstar_simple_dday_v6', JSON.stringify(schedules));
        }

        // 시작일과 종료일을 정확히 계산해서 상태값 구함
        function calculateDDay(startDateStr, endDateStr) {
            var today = new Date();
            today.setHours(0, 0, 0, 0);
            
            var start = new Date(startDateStr);
            start.setHours(0, 0, 0, 0);

            var end = endDateStr ? new Date(endDateStr) : start;
            end.setHours(0, 0, 0, 0);

            // 1. 시작 전 (오늘 < 시작일)
            if (today < start) {
                var diffTime = start - today;
                var diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                var badgeClass = 'bg-sky-500 text-white';
                if (diffDays <= 7) badgeClass = 'bg-blue-600 text-white font-black';
                return { text: 'D-' + diffDays, status: 'future', badgeClass: badgeClass };
            } 
            // 2. 진행 중 (시작일 <= 오늘 <= 종료일)
            else if (today >= start && today <= end) {
                var diffTime = end - today;
                var diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                var text = diffDays === 0 ? '오늘 종료' : '진행 중 (D-' + diffDays + ')';
                return { text: text, status: 'active', badgeClass: 'bg-emerald-500 text-white font-bold' };
            } 
            // 3. 종료됨 (오늘 > 종료일)
            else {
                return { text: '종료', status: 'past', badgeClass: 'bg-slate-200 text-slate-500' };
            }
        }

        function setFilter(filterType) {
            activeFilter = filterType;
            var buttons = document.querySelectorAll('.filter-btn');
            for (var i = 0; i < buttons.length; i++) {
                buttons[i].classList.remove('bg-sky-600', 'text-white', 'shadow-2xs');
                buttons[i].classList.add('bg-white', 'text-sky-800', 'border-sky-200');
            }
            
            var activeBtn = document.getElementById('filter-' + filterType);
            if (activeBtn) {
                activeBtn.classList.remove('bg-white', 'text-sky-800', 'border-sky-200');
                activeBtn.classList.add('bg-sky-600', 'text-white', 'shadow-2xs');
            }

            renderSchedules();
        }

        function renderSchedules() {
            var listContainer = document.getElementById('scheduleList');
            var searchQuery = document.getElementById('searchInput').value.toLowerCase().trim();

            var filtered = schedules.filter(function(item) {
                if (activeFilter === 'fav' && !item.isFav) return false;
                if (activeFilter === 'event' && item.type !== 'event') return false;
                if (activeFilter === 'scout' && item.type !== 'scout') return false;

                if (searchQuery) {
                    var matchTitle = item.title.toLowerCase().indexOf(searchQuery) !== -1;
                    var matchMain = (item.mainChar || '').toLowerCase().indexOf(searchQuery) !== -1;
                    var matchAll = (item.allChar || '').toLowerCase().indexOf(searchQuery) !== -1;
                    return matchTitle || matchMain || matchAll;
                }
                return true;
            });

            filtered.sort(function(a, b) {
                return new Date(a.krDate) - new Date(b.krDate);
            });

            if (filtered.length === 0) {
                listContainer.innerHTML = 
                    '<div class="text-center py-10 bg-white rounded-xl border border-sky-100">' +
                    '   <i class="fa-solid fa-calendar-xmark text-2xl text-sky-200 mb-2"></i>' +
                    '   <p class="text-xs text-slate-400 font-medium">조건에 맞는 일정이 없습니다.</p>' +
                    '</div>';
                return;
            }

            var htmlContent = '';
            for (var i = 0; i < filtered.length; i++) {
                var item = filtered[i];
                var dday = calculateDDay(item.krDate, item.endDate);
                var isEvent = item.type === 'event';
                var tagColor = isEvent ? 'bg-sky-100 text-sky-800' : 'bg-blue-100 text-blue-800';
                var tagLabel = isEvent ? '이벤트' : '스카우트';
                var mainCharacter = item.mainChar || '미정';
                var heartIcon = item.isFav ? 'fa-solid text-sky-500' : 'fa-regular text-slate-300';
                var dateRangeText = item.endDate ? item.krDate + ' ~ ' + item.endDate : item.krDate;

                htmlContent += 
                    '<div onclick="openDetailModal(\'' + item.id + '\')" class="bg-white rounded-xl p-3.5 card-shadow border border-sky-100/70 hover:border-sky-300 transition-all cursor-pointer active:scale-[0.99]">' +
                        '<div class="flex justify-between items-center mb-1.5">' +
                            '<span class="text-[10px] font-bold px-2 py-0.5 rounded-md ' + tagColor + '">' +
                                tagLabel +
                            '</span>' +
                            '<div class="flex items-center space-x-2">' +
                                '<span class="text-xs font-bold px-2.5 py-0.5 rounded-full ' + dday.badgeClass + '">' +
                                    dday.text +
                                '</span>' +
                                '<button onclick="event.stopPropagation(); toggleFav(\'' + item.id + '\')" class="text-base px-1 text-sky-400 hover:text-sky-600 transition">' +
                                    '<i class="' + heartIcon + ' fa-heart"></i>' +
                                '</button>' +
                            '</div>' +
                        '</div>' +
                        '<div class="my-1.5 flex items-center justify-between">' +
                            '<div class="pr-2 truncate">' +
                                '<h4 class="text-sm font-bold text-slate-800 truncate">' + item.title + '</h4>' +
                                '<p class="text-xs text-amber-700 font-medium truncate mt-0.5"><span class="bg-amber-100 text-amber-800 text-[9px] font-extrabold px-1 py-0.2 rounded mr-1">5★</span>' + mainCharacter + '</p>' +
                            '</div>' +
                            '<i class="fa-solid fa-chevron-right text-xs text-sky-300"></i>' +
                        '</div>' +
                        '<div class="bg-sky-50/70 rounded-lg px-2.5 py-1.5 mt-2 flex items-center justify-between text-[11px] text-slate-600">' +
                            '<span>기간: <strong class="text-sky-900">' + dateRangeText + '</strong></span>' +
                        '</div>' +
                    '</div>';
            }

            listContainer.innerHTML = htmlContent;
        }

        function openDetailModal(id) {
            var item = null;
            for (var i = 0; i < schedules.length; i++) {
                if (schedules[i].id === id) {
                    item = schedules[i];
                    break;
                }
            }
            if (!item) return;

            var dday = calculateDDay(item.krDate, item.endDate);
            var bannerContainer = document.getElementById('detailBannerContainer');
            var bannerImg = document.getElementById('detailBannerImg');

            if (item.banner && item.banner.trim() !== "") {
                bannerImg.src = item.banner;
                bannerContainer.style.display = 'block';
            } else {
                bannerContainer.style.display = 'none';
            }

            var dateRangeText = item.endDate ? item.krDate + ' ~ ' + item.endDate : item.krDate;

            document.getElementById('detailTitle').innerText = item.title;
            document.getElementById('detailKrDate').innerText = dateRangeText;
            document.getElementById('detailMainChar').innerText = item.mainChar || '정보 없음';
            document.getElementById('detailAllChar').innerText = item.allChar || item.mainChar || '정보 없음';

            var badge = document.getElementById('detailBadge');
            badge.innerText = dday.text;
            badge.className = 'absolute bottom-2.5 left-2.5 text-[11px] font-bold px-2.5 py-0.5 rounded-full shadow-md ' + dday.badgeClass;

            openModal('detailModal');
        }

        function toggleFav(id) {
            for (var i = 0; i < schedules.length; i++) {
                if (schedules[i].id === id) {
                    schedules[i].isFav = !schedules[i].isFav;
                    break;
                }
            }
            saveLocalStorageData();
            renderSchedules();
        }

        function openModal(id) {
            document.getElementById(id).classList.remove('hidden');
        }

        function closeModal(id) {
            document.getElementById(id).classList.add('hidden');
        }

        function closeModalOnBg(e, modalId) {
            if (e.target.id === modalId) {
                closeModal(modalId);
            }
        }
    </script>
