```html
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>앙스타 한섭 미래시 D-Day</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icon CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Font (Inter) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f0f7ff;
        }
        .card-shadow {
            box-shadow: 0 4px 14px 0 rgba(14, 165, 233, 0.08);
        }
    </style>
</head>
<body class="text-slate-800 min-h-screen pb-12 flex flex-col">

    <!-- Top Blue Header -->
    <header class="bg-gradient-to-r from-sky-700 via-sky-600 to-blue-600 text-white sticky top-0 z-30 shadow-sm">
        <div class="max-w-md mx-auto px-4 py-3.5 flex items-center justify-between">
            <div class="flex items-center space-x-2">
                <i class="fa-solid fa-calendar-check text-sky-200 text-lg"></i>
                <h1 class="text-base font-bold tracking-tight">앙스타 미래시 D-Day</h1>
            </div>
            <span class="text-xs bg-sky-800/60 px-2 py-0.5 rounded-full text-sky-100 font-medium">한섭 기준</span>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="max-w-md mx-auto w-full px-4 pt-4 flex-1">

        <!-- Search & Filter Controls -->
        <div class="space-y-3 mb-4">
            <!-- Search Bar -->
            <div class="relative">
                <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-sky-400 text-sm"></i>
                <input type="text" id="searchInput" oninput="renderSchedules()" placeholder="이벤트, 스카우트, 캐릭터 검색..." 
                    class="w-full pl-9 pr-4 py-2.5 bg-white border border-sky-100 rounded-xl text-xs placeholder-slate-400 focus:outline-none focus:border-sky-400 focus:ring-2 focus:ring-sky-100 transition shadow-2xs">
            </div>

            <!-- Tab Filters -->
            <div class="flex items-center justify-between gap-1.5 text-xs font-semibold">
                <button onclick="setFilter('all')" id="filter-all" class="filter-btn flex-1 py-2 rounded-xl border border-sky-200 bg-sky-600 text-white shadow-2xs transition">
                    전체 일정
                </button>
                <button onclick="setFilter('fav')" id="filter-fav" class="filter-btn flex-1 py-2 rounded-xl border border-sky-200 bg-white text-sky-800 transition flex items-center justify-center space-x-1">
                    <i class="fa-solid fa-heart text-sky-500 text-[10px]"></i>
                    <span>내 최애 일정</span>
                </button>
                <button onclick="setFilter('event')" id="filter-event" class="filter-btn py-2 px-3 rounded-xl border border-sky-200 bg-white text-sky-800 transition">
                    이벤트
                </button>
                <button onclick="setFilter('scout')" id="filter-scout" class="filter-btn py-2 px-3 rounded-xl border border-sky-200 bg-white text-sky-800 transition">
                    스카우트
                </button>
            </div>
        </div>

        <!-- Schedule Card List Container -->
        <div id="scheduleList" class="space-y-3">
            <!-- Rendered via JavaScript -->
        </div>

    </main>

    <!-- Banner & Detail View Modal -->
    <div id="detailModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-50 hidden flex items-center justify-center p-4" onclick="closeModalOnBg(event, 'detailModal')">
        <div class="bg-white rounded-2xl w-full max-w-sm overflow-hidden shadow-2xl transition-all border border-sky-100 animate-in fade-in zoom-in duration-200">
            <!-- Banner Image Section -->
            <div class="relative bg-slate-100 h-40 overflow-hidden">
                <img id="detailBannerImg" src="" alt="일정 배너" class="w-full h-full object-cover" onerror="this.src='https://placehold.co/600x240/0284c7/ffffff?text=Ensemble+Stars'">
                <div class="absolute inset-0 bg-gradient-to-t from-slate-900/70 via-transparent to-transparent"></div>
                <button onclick="closeModal('detailModal')" class="absolute top-2.5 right-2.5 w-7 h-7 bg-slate-900/40 hover:bg-slate-900/70 text-white rounded-full flex items-center justify-center transition">
                    <i class="fa-solid fa-xmark text-xs"></i>
                </button>
                <span id="detailBadge" class="absolute bottom-2.5 left-2.5 text-[11px] font-bold px-2.5 py-0.5 rounded-full shadow-md"></span>
            </div>

            <!-- Detail Information Body -->
            <div class="p-4 space-y-3">
                <div>
                    <span id="detailUnit" class="text-[11px] font-bold text-sky-600"></span>
                    <h3 id="detailTitle" class="text-base font-extrabold text-slate-800 mt-0.5 leading-snug"></h3>
                </div>

                <div class="space-y-2 border-t border-sky-100 pt-2.5">
                    <!-- 5 Star Main Character -->
                    <div class="bg-amber-50/80 border border-amber-100 rounded-lg p-2.5">
                        <div class="flex items-center space-x-1 mb-1">
                            <span class="bg-amber-500 text-white text-[9px] font-black px-1.5 py-0.2 rounded">5★</span>
                            <span class="text-[11px] font-bold text-amber-900">메인 캐릭터</span>
                        </div>
                        <p id="detailMainChar" class="text-xs font-bold text-amber-950 pl-0.5"></p>
                    </div>

                    <!-- All Characters (4 Star / 3 Star Include) -->
                    <div class="bg-sky-50/70 border border-sky-100 rounded-lg p-2.5">
                        <div class="flex items-center space-x-1 mb-1">
                            <i class="fa-solid fa-users text-sky-600 text-[10px]"></i>
                            <span class="text-[11px] font-bold text-sky-900">전체 등장 캐릭터 (4★ / 3★ 포함)</span>
                        </div>
                        <p id="detailAllChar" class="text-xs font-medium text-slate-700 leading-relaxed pl-0.5"></p>
                    </div>

                    <!-- Schedule Dates -->
                    <div class="grid grid-cols-2 gap-2 text-xs pt-1">
                        <div class="bg-slate-50 p-2 rounded-lg border border-slate-100">
                            <span class="text-[10px] text-slate-400 block font-medium">한섭 예상일</span>
                            <strong id="detailKrDate" class="text-sky-900 font-bold"></strong>
                        </div>
                        <div class="bg-slate-50 p-2 rounded-lg border border-slate-100">
                            <span class="text-[10px] text-slate-400 block font-medium">일섭 개최일</span>
                            <strong id="detailJpDate" class="text-slate-600 font-medium"></strong>
                        </div>
                    </div>
                </div>

                <div class="pt-1">
                    <button onclick="closeModal('detailModal')" class="w-full py-2.5 rounded-xl bg-sky-600 hover:bg-sky-700 text-white font-bold text-xs transition">
                        닫기
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Script Section -->
    <script>
        // Preset Data (이 부분을 직접 수정해서 일정을 추가/변경하실 수 있습니다!)
        var DEFAULT_PRESETS = [
            {
                id: 'preset_1',
                type: 'scout',
                title: '호전의 기사 와 기책의 별',
                unit: 'Knights / Trickstar',
                mainChar: '세나 이즈미',
                allChar: '5★ 세나 이즈미, 4★ 아케호시 스바루, 3★ 유우키 마코토, 3★ 나루카미 아라시',
                banner: 'https://i.ibb.co/vzD3x82/image.png',
                jpDate: '2025-10-15',
                krDate: '2026-10-15',
                isFav: true
            },
            {
                id: 'preset_2',
                type: 'event',
                title: '오르페우스의 눈물',
                unit: 'Valkyrie',
                mainChar: '이츠키 슈',
                allChar: '5★ 이츠키 슈, 4★ 카게히라 미카',
                banner: 'https://placehold.co/600x240/0284c7/ffffff?text=Valkyrie+Event',
                jpDate: '2025-11-15',
                krDate: '2026-11-15',
                isFav: true
            },
            {
                id: 'preset_3',
                type: 'scout',
                title: '피처 스카우트 리츠 2편',
                unit: 'Knights',
                mainChar: '사쿠마 리츠',
                allChar: '5★ 사쿠마 리츠, 4★ 스오우 쓰카사, 3★ 사쿠마 레이',
                banner: 'https://placehold.co/600x240/0369a1/ffffff?text=Ritsu+Scout',
                jpDate: '2025-11-25',
                krDate: '2026-11-25',
                isFav: false
            },
            {
                id: 'preset_4',
                type: 'event',
                title: '샤이니 트리스타 스테이지',
                unit: 'Trickstar',
                mainChar: '히다카 호쿠토',
                allChar: '5★ 히다카 호쿠토, 4★ 아케호시 스바루, 3★ 칸자키 소마',
                banner: 'https://placehold.co/600x240/38bdf8/ffffff?text=Trickstar+Stage',
                jpDate: '2025-12-15',
                krDate: '2026-12-15',
                isFav: false
            }
        ];

        var schedules = [];
        var activeFilter = 'all';

        window.addEventListener('DOMContentLoaded', function() {
            loadLocalStorageData();
            renderSchedules();
        });

        function loadLocalStorageData() {
            var savedSchedules = localStorage.getItem('enstar_simple_dday_v4');
            if (savedSchedules) {
                try {
                    schedules = JSON.parse(savedSchedules);
                } catch(e) {
                    schedules = DEFAULT_PRESETS;
                }
            } else {
                schedules = DEFAULT_PRESETS;
            }
        }

        function saveLocalStorageData() {
            localStorage.setItem('enstar_simple_dday_v4', JSON.stringify(schedules));
        }

        function calculateDDay(targetDateStr) {
            var today = new Date();
            today.setHours(0, 0, 0, 0);
            
            var target = new Date(targetDateStr);
            target.setHours(0, 0, 0, 0);

            var diffTime = target - today;
            var diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

            if (diffDays === 0) return { text: 'D-DAY', isPast: false, badgeClass: 'bg-sky-600 text-white' };
            if (diffDays < 0) return { text: '종료 (' + Math.abs(diffDays) + '일 전)', isPast: true, badgeClass: 'bg-slate-200 text-slate-500' };
            
            var badgeClass = 'bg-sky-500 text-white';
            if (diffDays <= 30) badgeClass = 'bg-blue-600 text-white font-black';
            else if (diffDays <= 90) badgeClass = 'bg-sky-600 text-white';

            return { text: 'D-' + diffDays, days: diffDays, isPast: false, badgeClass: badgeClass };
        }

        function setFilter(filterType) {
            activeFilter = filterType;
            var buttons = document.querySelectorAll('.filter-btn');
            for (var i = 0; i < buttons.length; i++) {
                buttons[i].classList.remove('bg-sky-600', 'text-white', 'shadow-2xs');
                buttons[i].classList.add('bg-white', 'text-sky-800', 'border-sky-200');
            }
            
            var activeBtn = document.getElementById('filter-' + filterType);
            if (activeBtn) {
                activeBtn.classList.remove('bg-white', 'text-sky-800', 'border-sky-200');
                activeBtn.classList.add('bg-sky-600', 'text-white', 'shadow-2xs');
            }

            renderSchedules();
        }

        function renderSchedules() {
            var listContainer = document.getElementById('scheduleList');
            var searchQuery = document.getElementById('searchInput').value.toLowerCase().trim();

            var filtered = schedules.filter(function(item) {
                if (activeFilter === 'fav' && !item.isFav) return false;
                if (activeFilter === 'event' && item.type !== 'event') return false;
                if (activeFilter === 'scout' && item.type !== 'scout') return false;

                if (searchQuery) {
                    var matchTitle = item.title.toLowerCase().indexOf(searchQuery) !== -1;
                    var matchUnit = item.unit.toLowerCase().indexOf(searchQuery) !== -1;
                    var matchMain = (item.mainChar || item.character || '').toLowerCase().indexOf(searchQuery) !== -1;
                    var matchAll = (item.allChar || '').toLowerCase().indexOf(searchQuery) !== -1;
                    return matchTitle || matchUnit || matchMain || matchAll;
                }
                return true;
            });

            filtered.sort(function(a, b) {
                return new Date(a.krDate) - new Date(b.krDate);
            });

            if (filtered.length === 0) {
                listContainer.innerHTML = 
                    '<div class="text-center py-10 bg-white rounded-xl border border-sky-100">' +
                    '   <i class="fa-solid fa-calendar-xmark text-2xl text-sky-200 mb-2"></i>' +
                    '   <p class="text-xs text-slate-400 font-medium">등록되거나 조건에 맞는 일정이 없습니다.</p>' +
                    '</div>';
                return;
            }

            var htmlContent = '';
            for (var i = 0; i < filtered.length; i++) {
                var item = filtered[i];
                var dday = calculateDDay(item.krDate);
                var isEvent = item.type === 'event';
                var tagColor = isEvent ? 'bg-sky-100 text-sky-800' : 'bg-blue-100 text-blue-800';
                var tagLabel = isEvent ? '이벤트' : '스카우트';
                var mainCharacter = item.mainChar || item.character || '미정';
                var heartIcon = item.isFav ? 'fa-solid text-sky-500' : 'fa-regular text-slate-300';
                var jpDateText = item.jpDate ? '<span class="text-[10px] text-slate-400 ml-2">(일섭: ' + item.jpDate + ')</span>' : '';

                htmlContent += 
                    '<div onclick="openDetailModal(\'' + item.id + '\')" class="bg-white rounded-xl p-3.5 card-shadow border border-sky-100/70 hover:border-sky-300 transition-all cursor-pointer active:scale-[0.99]">' +
                        '<div class="flex justify-between items-center mb-1.5">' +
                            '<div class="flex items-center space-x-1.5">' +
                                '<span class="text-[10px] font-bold px-2 py-0.5 rounded-md ' + tagColor + '">' +
                                    tagLabel +
                                '</span>' +
                                '<span class="text-xs font-semibold text-slate-600">' + item.unit + '</span>' +
                            '</div>' +
                            '<div class="flex items-center space-x-2">' +
                                '<span class="text-xs font-bold px-2.5 py-0.5 rounded-full ' + dday.badgeClass + '">' +
                                    dday.text +
                                '</span>' +
                                '<button onclick="event.stopPropagation(); toggleFav(\'' + item.id + '\')" class="text-base px-1 text-sky-400 hover:text-sky-600 transition">' +
                                    '<i class="' + heartIcon + ' fa-heart"></i>' +
                                '</button>' +
                            '</div>' +
                        '</div>' +
                        '<div class="my-1.5 flex items-center justify-between">' +
                            '<div class="pr-2 truncate">' +
                                '<h4 class="text-sm font-bold text-slate-800 truncate">' + item.title + '</h4>' +
                                '<p class="text-xs text-amber-700 font-medium truncate mt-0.5"><span class="bg-amber-100 text-amber-800 text-[9px] font-extrabold px-1 py-0.2 rounded mr-1">5★</span>' + mainCharacter + '</p>' +
                            '</div>' +
                            '<i class="fa-solid fa-chevron-right text-xs text-sky-300"></i>' +
                        '</div>' +
                        '<div class="bg-sky-50/70 rounded-lg px-2.5 py-1.5 mt-2 flex items-center justify-between text-[11px] text-slate-600">' +
                            '<div>' +
                                '<span>한섭 예상: <strong class="text-sky-900">' + item.krDate + '</strong></span>' +
                                jpDateText +
                            '</div>' +
                        '</div>' +
                    '</div>';
            }

            listContainer.innerHTML = htmlContent;
        }

        function openDetailModal(id) {
            var item = null;
            for (var i = 0; i < schedules.length; i++) {
                if (schedules[i].id === id) {
                    item = schedules[i];
                    break;
                }
            }
            if (!item) return;

            var dday = calculateDDay(item.krDate);
            var bannerImg = item.banner || 'https://placehold.co/600x240/0284c7/ffffff?text=Ensemble+Stars';

            document.getElementById('detailBannerImg').src = bannerImg;
            document.getElementById('detailTitle').innerText = item.title;
            document.getElementById('detailUnit').innerText = '[' + (item.type === 'event' ? '이벤트' : '스카우트') + '] ' + item.unit;
            document.getElementById('detailKrDate').innerText = item.krDate;
            document.getElementById('detailJpDate').innerText = item.jpDate || '정보 없음';
            document.getElementById('detailMainChar').innerText = item.mainChar || item.character || '정보 없음';
            document.getElementById('detailAllChar').innerText = item.allChar || item.mainChar || item.character || '전체 참가 정보 없음';

            var badge = document.getElementById('detailBadge');
            badge.innerText = dday.text;
            badge.className = 'absolute bottom-2.5 left-2.5 text-[11px] font-bold px-2.5 py-0.5 rounded-full shadow-md ' + dday.badgeClass;

            openModal('detailModal');
        }

        function toggleFav(id) {
            for (var i = 0; i < schedules.length; i++) {
                if (schedules[i].id === id) {
                    schedules[i].isFav = !schedules[i].isFav;
                    break;
                }
            }
            saveLocalStorageData();
            renderSchedules();
        }

        function openModal(id) {
            document.getElementById(id).classList.remove('hidden');
        }

        function closeModal(id) {
            document.getElementById(id).classList.add('hidden');
        }

        function closeModalOnBg(e, modalId) {
            if (e.target.id === modalId) {
                closeModal(modalId);
            }
        }
    </script>
</body>
</html>
